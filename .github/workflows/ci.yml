name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Run tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          TELEGRAM_BOT_TOKEN: dummy_token_for_ci
          TELEGRAM_ADMIN_USER_ID: "0"
          SUPABASE_DB_URL: postgresql://dummy:dummy@localhost:5432/dummy
          OPENROUTER_API_KEY: dummy_openrouter_key
          OPENAI_API_KEY: dummy_openai_key
          LOG_LEVEL: WARNING
          ENVIRONMENT: test
        run: pytest tests/ -v --tb=short
